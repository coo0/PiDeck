name: Fork Sync Upstream

# 全自动上游同步（D 方案）：
#   cron 每日 + 手动触发 → 在 CI 里跑 scripts/sync-upstream.mjs
#   → 合并 upstream/main 到 custom（冲突按 docs/fork-conflict-policy.md 自动解决）
#   → typecheck + 全量测试门禁 → 全绿才 push custom
#   → 策略未覆盖的冲突 / 门禁失败 → 开 issue（带冲突报告），**不推送**。
#
# 为什么不做「打 tag + 自动发版」：发版需要人工确认版本号与变更说明。同步与发版解耦：
# 本 workflow 只负责把 custom 更新到最新；发版走 fork-release.yml（手动触发）。
#
# 注意：fork 的 custom 分支不是默认分支，cron 事件使用默认分支上的 workflow 文件，
# 因此本文件必须先合入 main 才生效（与上游 post-release-sidecars 同一机制）。

on:
  schedule:
    # 每天 03:17 UTC（北京时间 11:17），避开上游发版高峰
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "跳过测试门禁（仅调试用；正式同步勿勾）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# 同一时间只允许一个同步任务，避免两个 worktree 同时推 custom
concurrency:
  group: fork-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream/main into custom
    runs-on: ubuntu-latest
    # 全量测试偶尔会挂住（AGENTS.md 记录过 Windows runner 的并发挂起）；
    # 没有超时的话 job 会一直挂到 GitHub 的 6 小时上限，白白占住 concurrency 组。
    timeout-minutes: 45
    steps:
      - name: Checkout custom
        uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/ayuayue/PiDeck.git
          git fetch upstream --tags

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync upstream (merge + policy + gates)
        id: sync
        env:
          SKIP_TESTS: ${{ inputs.skip_tests == true && '--skip-tests' || '' }}
        run: |
          # 显式控制退出码：不同 runner/默认 shell 下 -e/-o pipefail 组合不一致，
          # 若依赖默认行为，node 失败后最后一条 echo 可能把步骤“洗成”成功（
          # 结果是同步失败但 CI 全绿，最危险的静默失败）。这里自己捕获再显式 exit。
          set +e
          node scripts/sync-upstream.mjs $SKIP_TESTS 2>&1 | tee sync.log
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${STATUS}" >> "$GITHUB_OUTPUT"
          exit "$STATUS"

      - name: Upload sync log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-sync-log
          path: |
            sync.log
            fork-sync-conflict-report.json
          if-no-files-found: ignore

      # 策略未覆盖的冲突 / 门禁失败：脚本已 abort 且未推送。
      # 通知双通道：
      #   1. job summary —— 一定可用（不依赖 Issues 是否开启），在 Actions 运行页顶部直接可见；
      #   2. issue —— 尽力而为；fork 可能关闭了 Issues，或 token 无 issues 权限，
      #      此时不能因为「通知失败」把本步骤也弄红（真正的原因已写在 summary 与日志里）。
      - name: Report conflict or gate failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = "fork-sync-conflict-report.json";
            let body = "自动同步 upstream/main → custom 失败，**未推送**。\n\n";
            let title = "🔀 上游同步失败：需要人工处理";
            if (fs.existsSync(path)) {
              const report = JSON.parse(fs.readFileSync(path, "utf8"));
              title = `🔀 上游同步失败（${report.reason}）`;
              body += `原因：\`${report.reason}\`\n\n`;
              if (report.files) {
                body += `### 策略未覆盖的冲突文件\n\n${report.files.map((f) => `- \`${f}\``).join("\n")}\n\n`;
              }
              if (report.detail) {
                for (const item of report.detail) {
                  body += `<details><summary>${item.file}</summary>\n\n\`\`\`\n${item.content}\n\`\`\`\n\n</details>\n\n`;
                }
              }
              if (report.output) {
                body += `<details><summary>门禁输出（尾部）</summary>\n\n\`\`\`\n${report.output}\n\`\`\`\n\n</details>\n\n`;
              }
            } else {
              body += "未生成冲突报告，请看 Actions 运行日志。\n\n";
            }
            body += `处理方式见 [docs/fork-conflict-policy.md](../blob/custom/docs/fork-conflict-policy.md)。\n\n运行：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // 1) job summary：始终可用，不依赖 Issues 开关
            await core.summary.addRaw(`## ${title}\n\n${body}`).write();

            // 2) issue：尽力而为（fork 可能关闭了 Issues）
            try {
              const existing = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                labels: "sync-upstream-conflict",
              });
              if (existing.data.length > 0) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.data[0].number,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ["sync-upstream-conflict"],
                });
              }
              core.info("已创建/更新同步失败 issue");
            } catch (error) {
              // Issues 被关闭或权限不足：只告警，不让通知本身成为新的失败
              core.warning(`无法创建 issue（fork 可能关闭了 Issues）：${error.message}。原因已写入本次运行的 Summary。`);
            }
